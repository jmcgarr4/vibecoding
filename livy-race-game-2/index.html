<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Livy's Race Game 2! 🏆</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div id="app">

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen active">
    <div class="title-block">
      <div class="title-emoji">🏆</div>
      <h1>Livy's<br>Race Game 2!</h1>
      <p>Steer your machine and race to win!</p>
    </div>
    <!-- Speed picker -->
    <div class="speed-picker">
      <div class="speed-label">Start Speed: <span id="speed-name">5</span></div>
      <div class="speed-btns" id="speed-btns"></div>
    </div>

    <div class="vehicle-grid">
      <button class="vehicle-card" onclick="startGame('car')">
        <div class="vehicle-icon">🏎️</div>
        <div class="vehicle-name">Race Car</div>
        <div class="vehicle-track">🛣️ Land</div>
      </button>
      <button class="vehicle-card" onclick="startGame('airplane')">
        <div class="vehicle-icon">✈️</div>
        <div class="vehicle-name">Airplane</div>
        <div class="vehicle-track">☁️ Sky</div>
      </button>
      <button class="vehicle-card" onclick="startGame('submarine')">
        <div class="vehicle-icon">🐬</div>
        <div class="vehicle-name">Submarine</div>
        <div class="vehicle-track">🌊 Ocean</div>
      </button>
    </div>
  </div>

  <!-- BUILD SCREEN -->
  <div id="screen-build" class="screen">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <div class="factory-header">
      <h2 id="factory-title">🏭 Factory</h2>
      <div class="parts-bar">
        <div class="part-slot" id="part-slot-0"><span class="part-q">❓</span></div>
        <div class="part-slot" id="part-slot-1"><span class="part-q">❓</span></div>
        <div class="part-slot" id="part-slot-2"><span class="part-q">❓</span></div>
      </div>
      <div id="build-progress-text">Solve puzzles to build your machine!</div>
    </div>
    <div id="puzzle-container">
      <div id="puzzle-number"></div>
      <div id="puzzle-question"></div>
      <div id="puzzle-display"></div>
      <div id="puzzle-choices" class="choices-grid"></div>
      <div id="puzzle-feedback" class="feedback hidden"></div>
    </div>
  </div>

  <!-- RACE SCREEN -->
  <div id="screen-race" class="screen">
    <!-- Progress bars -->
    <div id="race-progress">
      <div class="prog-row">
        <span class="prog-racer-label">Livy</span>
        <div class="prog-track"><div class="prog-fill" id="livy-fill"></div></div>
        <span class="prog-flag">🏁</span>
      </div>
      <div class="prog-row">
        <span class="prog-racer-label">CPU</span>
        <div class="prog-track"><div class="prog-fill" id="cpu-fill"></div></div>
        <span class="prog-flag">🏁</span>
      </div>
    </div>

    <!-- In-race speed dial -->
    <div id="race-speed-strip">
      <span class="rss-label">Speed: <b id="rss-name">5</b></span>
      <div id="rss-btns"></div>
    </div>

    <!-- Main game lane (2D steering) -->
    <div id="game-lane">
      <div id="game-bg"></div>
      <div id="livy-runner">🏎️</div>
      <div id="obstacle-layer"></div>
      <div id="hit-flash" class="hidden"></div>
      <div id="race-countdown">
        <div id="countdown-num">3</div>
      </div>
    </div>

    <!-- D-pad controls -->
    <div id="dpad">
      <button class="dpad-btn" id="dpad-up"
        ontouchstart="dpadStart('up')" ontouchend="dpadEnd('up')" ontouchcancel="dpadEnd('up')"
        onmousedown="dpadStart('up')" onmouseup="dpadEnd('up')" onmouseleave="dpadEnd('up')">⬆️</button>
      <div class="dpad-mid-row">
        <button class="dpad-btn" id="dpad-left"
          ontouchstart="dpadStart('left')" ontouchend="dpadEnd('left')" ontouchcancel="dpadEnd('left')"
          onmousedown="dpadStart('left')" onmouseup="dpadEnd('left')" onmouseleave="dpadEnd('left')">⬅️</button>
        <div class="dpad-center">🎮</div>
        <button class="dpad-btn" id="dpad-right"
          ontouchstart="dpadStart('right')" ontouchend="dpadEnd('right')" ontouchcancel="dpadEnd('right')"
          onmousedown="dpadStart('right')" onmouseup="dpadEnd('right')" onmouseleave="dpadEnd('right')">➡️</button>
      </div>
      <button class="dpad-btn" id="dpad-down"
        ontouchstart="dpadStart('down')" ontouchend="dpadEnd('down')" ontouchcancel="dpadEnd('down')"
        onmousedown="dpadStart('down')" onmouseup="dpadEnd('down')" onmouseleave="dpadEnd('down')">⬇️</button>
    </div>

    <!-- Computer's lane (display only) -->
    <div id="cpu-lane">
      <span id="cpu-lane-label">Computer</span>
      <div id="cpu-bg"></div>
      <div id="cpu-ground-line"></div>
      <div id="cpu-runner">🚗</div>
      <div id="cpu-obstacle-layer"></div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="screen-result" class="screen">
    <div id="result-animation"></div>
    <h2 id="result-title"></h2>
    <p id="result-message"></p>
    <div id="result-score"></div>
    <button class="big-btn" onclick="goHome()">Play Again! 🎮</button>
  </div>

</div>
<script src="script.js?v=2"></script>
</body>
</html>
